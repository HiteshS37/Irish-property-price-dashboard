name: Validate analytics
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/irppi_clean_data.py
      - run: python scripts/irppi_eda_analysis.py
      - run: python scripts/irppi_forecast_analysis.py
      - run: python scripts/irppi_backtest.py
